trigger:
  branches:
    include:
      - poc/deploy-vps-donweb

pr: none

variables:
  nodeVersion: '22.x'
  artifactName: 'portal-medico-dist'
  deployPath: '/var/www/kinesis/backoffice/'
  VITE_API_URL: 'https://api.kinesis.com.ar'
  VITE_SUPABASE_URL: 'REEMPLAZAR_CON_URL_DE_SUPABASE'
  VITE_SUPABASE_ANON_KEY: 'REEMPLAZAR_CON_ANON_KEY_DE_SUPABASE'

stages:
  - stage: Build
    displayName: 'Compilar Portal Medico'
    jobs:
      - job: BuildSpa
        displayName: 'Typecheck y build de produccion'
        pool:
          vmImage: 'ubuntu-latest'
        steps:
          - task: NodeTool@0
            displayName: 'Instalar Node.js'
            inputs:
              versionSpec: '$(nodeVersion)'

          - script: npm ci
            displayName: 'Instalar dependencias'

          - script: npm run build
            displayName: 'Generar bundle de produccion'
            env:
              VITE_API_URL: $(VITE_API_URL)
              VITE_SUPABASE_URL: $(VITE_SUPABASE_URL)
              VITE_SUPABASE_ANON_KEY: $(VITE_SUPABASE_ANON_KEY)

          - task: PublishPipelineArtifact@1
            displayName: 'Publicar dist'
            inputs:
              targetPath: '$(Build.SourcesDirectory)/dist'
              artifact: '$(artifactName)'
              publishLocation: 'pipeline'

  - stage: Deploy
    displayName: 'Desplegar en VPS Donweb'
    dependsOn: Build
    condition: succeeded()
    jobs:
      - job: DeploySpa
        displayName: 'Publicar archivos estaticos'
        pool:
          name: 'Kinesis-Ubuntu'
        workspace:
          clean: all
        steps:
          - checkout: none

          - task: DownloadPipelineArtifact@2
            displayName: 'Descargar dist'
            inputs:
              buildType: 'current'
              artifactName: '$(artifactName)'
              targetPath: '$(Pipeline.Workspace)/$(artifactName)'

          - bash: |
              set -euo pipefail

              source_path="$(Pipeline.Workspace)/$(artifactName)/"
              deploy_path="$(deployPath)"

              if ! command -v rsync >/dev/null 2>&1; then
                echo "##vso[task.logissue type=error]rsync no esta instalado en el VPS."
                exit 1
              fi

              if [ ! -f "${source_path}index.html" ]; then
                echo "##vso[task.logissue type=error]El artefacto no contiene index.html."
                exit 1
              fi

              mkdir -p "$deploy_path"
              rsync --archive --delete "$source_path" "$deploy_path"

              if [ ! -f "${deploy_path}index.html" ]; then
                echo "##vso[task.logissue type=error]El despliegue no genero index.html en el destino."
                exit 1
              fi
            displayName: 'Sincronizar archivos con Nginx'

          - bash: |
              set -euo pipefail
              curl --fail --silent --show-error \
                --header 'Host: kinesis.com.ar' \
                http://127.0.0.1/ \
                --output /dev/null
            displayName: 'Validar respuesta HTTP local'
